name: Bug report
description: Report a reproducible Frontier Hunts installation or gameplay problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use the private reporting link instead. Never include the archive password, access tokens or private server details."
  - type: input
    id: mod_version
    attributes:
      label: Frontier Hunts version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft, NeoForge and operating system
      placeholder: "Minecraft 1.21.1; NeoForge 21.1.248; Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Describe what you did, what you expected and what happened instead."
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Other mods, shaders and multiplayer
      description: "List relevant mods or shaders and whether this happens in singleplayer or on a server."
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or extraction errors
      description: "For extraction problems, include your extraction app and its version. Review logs for private information before attaching them."
